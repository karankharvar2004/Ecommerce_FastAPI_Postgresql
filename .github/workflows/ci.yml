name: Ecommerce CI/CD Pipeline

on:
  push:
    branches:
      - Ecommerce_Company_Arc

  pull_request:
    branches:
      - Ecommerce_Company_Arc

jobs:

  build:

    name: Build & Verify Application

    runs-on: ubuntu-latest

    env:
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ecommerce_test

      SECRET_KEY: test_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-south-1
      AWS_BUCKET_NAME: test-bucket

      CLOUDFRONT_URL: https://example.com

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI Application
        run: |
          python -c "from src.main import app; print('Application Loaded Successfully')"

  docker:

    name: Build & Push Docker Image

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t karn21/ecommerce-fastapi:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push karn21/ecommerce-fastapi:latest

  deploy:

    name: Deploy to EC2

    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu/ecommerce-deployment

            docker compose pull

            docker compose up -d

            docker image prune -f

            docker ps